[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-discovery"
version = "0.1.0a1"
description = "Provider-neutral service discovery contract and static local implementation for Orbit."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
process = [
  "orbit-core[process-plugins]>=0.1.0a1,<0.2",
  "protobuf>=7.35.1,<8",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_discovery"]

[tool.hatch.build.targets.wheel.force-include]
"proto/orbit_discovery/v1/service_discovery.proto" = "orbit_discovery/v1/service_discovery.proto"

[tool.hatch.build.targets.sdist.force-include]
"proto/orbit_discovery/v1/service_discovery.proto" = "proto/orbit_discovery/v1/service_discovery.proto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/orbit_discovery/v1/service_discovery_pb2.py", "src/orbit_discovery/v1/service_discovery_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_discovery"]
